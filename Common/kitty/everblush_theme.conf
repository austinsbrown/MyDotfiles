# Kitty color scheme (Everblush)
# Included from kitty.conf. Replace this file to change the color scheme.

# The basic colors
foreground              #DADADA
background              #181F21
selection_foreground    #DADADA
selection_background    #3B4244

# Cursor colors
cursor                  #DADADA
cursor_text_color       #181F21

# URL underline color when hovering with mouse
url_color               #6695A3

# Kitty window border colors
active_border_color     #6695A3
inactive_border_color   #3B4244
bell_border_color       #E5C76B

# Tab bar colors
active_tab_foreground   #181F21
active_tab_background   #6695A3
inactive_tab_foreground #B3B9B8
inactive_tab_background #21282A
tab_bar_background      #131A1C

# Colors for marks (marked text in the terminal)
mark1_foreground #181F21
mark1_background #67B0E8
mark2_foreground #181F21
mark2_background #C47FD5
mark3_foreground #181F21
mark3_background #67CBE7

# The 16 terminal colors

# black
color0 #22292B
color8 #3B4244

# red
color1 #E06E6E
color9 #EF7D7D

# green
color2  #8CCF7E
color10 #9BDEAD

# yellow
